apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  tls:
  - hosts:
      - {{ .Values.ingress_url }}.att.com
    secretName: {{ .Values.environmentType }}-ingress-tls
  rules:
  - host: {{ .Values.ingress_url }}.att.com
    http:
      paths:
      - path: {{ .Values.ingress.fePath }}
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}
            port:
              number: {{ .Values.service.port }}
