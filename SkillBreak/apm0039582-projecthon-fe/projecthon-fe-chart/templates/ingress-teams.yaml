apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-teams
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  tls:
  - hosts:
      - {{ .Values.ingress_url }}.att.com
    secretName: {{ .Values.environmentType }}-ingress-tls
  rules:
  - host: {{ .Values.ingress_url }}.att.com
    http:
      paths:
      {{- $apiPrefix := .Values.ingress.apiPrefix }}
      {{- range .Values.ingress.teamServices }}
      - path: /{{ $apiPrefix }}/{{ .path }}(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ .service }}
            port:
              number: {{ .port }}
      {{- end }}
