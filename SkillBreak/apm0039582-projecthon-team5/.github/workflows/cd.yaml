name: projecthon-team5 - CD

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to Deploy'
        default: '1.0.0'
        required: true
        type: string

      authentication:
        description: 'Authentication ID'
        default: 'projecthon-team5'
        required: true
        type: string

      invoked_by:
        description: 'Invoked by'
        default: 'undef'
        required: false
        type: string

      run_id:
        description: 'Run ID'
        default: ''
        required: false
        type: string

      dora_unique_id:
        description: 'Dora Unique ID for correlation'
        default: ''
        required: false
        type: string

      ############################################

      dev:
        description: 'Deploy to Dev'
        default: true
        required: false
        type: boolean


permissions:
  id-token: write
  contents: read
  attestations: write

jobs:

  #+--------------------+
  #|  Info              |
  #+--------------------+

  info:
    name: Information
    runs-on:
      group: 'apm0039582-runner-group-primary'
      labels: [apm0039582-runner-group-primary,104f2b40-4cb3-426a-9c9c-364a35d447fa]
    steps:
      - name: Echo Deploy Information
        env:
          VERSION: ${{ inputs.version }}
          INVOKED_BY: ${{ inputs.invoked_by }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          printf "[INFO] Triggered by workflow: %s\n" "${INVOKED_BY} - ${VERSION}"
          printf "[INFO] Link To Running Workflow: https://github.com/${{ github.repository }}/actions/runs/${RUN_ID}\n"


  #+--------------------+
  #|  Env:    Dev       |
  #+--------------------+
  dev:
    name: Deploy - dev
    runs-on:
      group: 'apm0039582-runner-group-primary'
      labels: [apm0039582-runner-group-primary,104f2b40-4cb3-426a-9c9c-364a35d447fa]
    environment: Dev
    env:
      configuration_repository: ''
      configuration_repository_branch: ''
      configuration_repository_path: './common_config'
      environments_files: |
        - ".github/variables/shared_vars.yaml"
        - "./.github/variables/dev/cd_vars.yaml"
    steps:
    - name: Check Authentication ID
      shell: bash
      run: |
        [ "${{ inputs.authentication }}" = "${{ secrets.AUTHENTICATION_ID }}" ] \
        && echo "AUTHENTICATION ID matches. Proceeding with deployment" \
        || { echo "AUTHENTICATION ID does not match. Aborting deployment"; exit 1; }

    - name: 'Pre-Deployment'
      shell: bash
      run: |
        printf "Deploying to %s\n" "${{ env.ENV }}"
        echo "::notice::Dev ${{ inputs.version }} deployed on $(date)"

    - name: 'AKS - Dev'
      uses: ATT-IDP/revup-deployment-aks@v3
      with:
        azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
        environment: 'dev' # refers to the filename under <charts>/envs/<env>.yaml
        jfrog_access_token: ${{ secrets.JFROG_ACCESS_TOKEN }}
        jfrog_username: ${{ secrets.JFROG_USERNAME }}
        app_id: ${{ secrets.GH_REVUP_APP_ID }}
        app_private_key: ${{ secrets.GH_REVUP_APP_KEY }}
        version: ${{ inputs.version }}

    - name: 'Dora Notification'
      uses: ATT-IDP/revup-teamup-dora@v3
      with:
        version: ${{ inputs.version }}
        report_type: 'deploy'
        environment_name: 'Dev'
        dora_unique_id: ${{ inputs.dora_unique_id }}
        app_id: ${{ secrets.GH_REVUP_APP_ID }}
        app_private_key: ${{ secrets.GH_REVUP_APP_KEY }}
    if: ${{ inputs.dev }}
