name: projecthon-team5
services:
  workspace-init:
    image: node:22-alpine
    working_dir: /app
    environment:
      NPM_CONFIG_USERCONFIG: /run/secrets/npmrc
    secrets:
      - npmrc
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run build --workspace @team5/contracts && npm run build --workspace @team5/messaging"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    image: node:22-alpine
    working_dir: /app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_SSL: ${DB_SSL:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_ISSUER: ${JWT_ISSUER:-escape-room-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-escape-room-client}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      ENGINE_INTERNAL_URL: http://engine:3001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["npm", "run", "start:dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
  engine-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ENGINE_DB_USER:?Set ENGINE_DB_USER}
      POSTGRES_PASSWORD: ${ENGINE_DB_PASSWORD:?Set ENGINE_DB_PASSWORD}
      POSTGRES_DB: ${ENGINE_DB_NAME:-engine_db}
    ports:
      - "127.0.0.1:${ENGINE_DB_PORT:-5433}:5432"
    volumes:
      - engine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
  engine-migrate:
    image: node:22-alpine
    working_dir: /app
    environment: &engine-environment
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3001
      ENGINE_DB_HOST: engine-db
      ENGINE_DB_PORT: 5432
      ENGINE_DB_USER: ${ENGINE_DB_USER:?Set ENGINE_DB_USER}
      ENGINE_DB_PASSWORD: ${ENGINE_DB_PASSWORD:?Set ENGINE_DB_PASSWORD}
      ENGINE_DB_NAME: ${ENGINE_DB_NAME:-engine_db}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_ISSUER: ${JWT_ISSUER:-escape-room-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-escape-room-client}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SANDBOX_RUNTIME_CLASS: runc
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      engine-db:
        condition: service_healthy
    command: ["npm", "run", "migration:run", "--workspace", "@team5/game-engine"]
  engine:
    image: node:22-alpine
    working_dir: /app
    environment: *engine-environment
    ports:
      - "127.0.0.1:${ENGINE_PORT:-3001}:3001"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      engine-migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "start:dev", "--workspace", "@team5/game-engine"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
  sql-sandbox:
    profiles: ["demo-local"]
    image: local/room1-sql:dev
    build:
      context: ./sandboxes/sql
      secrets:
        - npmrc
    user: "70:70"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    tmpfs:
      - /var/lib/postgresql/data:size=56m
      - /run/postgresql:size=4m
      # Writable helper journal (/tmp/sql-executions, one directory per executionToken).
      - /tmp:size=16m
    healthcheck:
      test: ["CMD", "node", "/opt/sql/query-helper.mjs", "ready"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
volumes:
  pgdata:
  node_modules:
  engine_pgdata:
secrets:
  npmrc:
    file: ${NPM_USER_CONFIG:-./.npmrc.example}