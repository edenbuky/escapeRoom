apiVersion: v1
kind: Service
metadata:
  name: projecthon-team5
  labels:
    app.kubernetes.io/name: projecthon-team5
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
    {{- if .Values.fullStack.enabled }}
    - port: 3001
      targetPort: engine
      protocol: TCP
      name: engine
    {{- end }}
  selector:
    app.kubernetes.io/name: projecthon-team5
    app.kubernetes.io/instance: {{ .Release.Name }}
