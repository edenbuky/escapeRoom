<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>projecton v2 — architecture explainer</title>
<style>
:root {
  --bg: #f7f8fb; --ink: #0f172a; --muted: #5b6475; --line: #e3e7ef; --card: #fff;
  --client: #2563eb; --client-bg: #eef4ff;
  --service: #0f766e; --service-bg: #ecfbf8;
  --core: #4338ca; --core-bg: #eef0ff;
  --infra: #8a6a1f; --infra-bg: #fbf7ec;
  --bus: #7c3aed; --http: #1e293b; --sse: #2563eb; --inproc: #4338ca;
  --radius: 14px; --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 14px rgba(15,23,42,.05);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; }
.top { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding: 16px 24px 8px; flex-wrap: wrap; }
.top h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.headline { margin: 4px 0 0; font-size: 15px; color: var(--core); font-weight: 600; }
.modes { display: flex; gap: 6px; background: #eceff5; padding: 4px; border-radius: 999px; }
.modes button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-size: 14px; color: var(--muted); }
.modes button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 4px 24px 10px; font-size: 12.5px; color: var(--muted); }
.lg-item { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; border: 2px solid; }
.sw.g-client { border-color: var(--client); background: var(--client-bg); border-width: 1.5px; }
.sw.g-service { border-color: var(--service); background: var(--service-bg); border-width: 3px; }
.sw.g-core { border-color: var(--core); background: var(--core); }
.sw.g-infra { border-color: var(--infra); background: var(--infra-bg); border-style: dashed; }
.sw.shape-ms { border: 3px solid var(--ink); background: #fff; width: 20px; }
.sw.shape-mod { border: 1.5px dashed var(--core); background: #fff; width: 20px; height: 12px; }
.sw.shape-infra { border: 1.5px dashed var(--muted); background: #fff; width: 20px; }
.ln { display: inline-block; width: 26px; height: 0; border-top: 2.5px solid; }
.ln-inproc { border-top: 4px solid var(--inproc); width: 14px; } .ln-bus { border-top-style: dashed; border-color: var(--bus); }
.ln-http { border-top-style: dotted; border-color: var(--http); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; padding: 0 24px 24px; align-items: start; }

/* ---------- map ---------- */
.map-wrap { min-width: 0; }
.map { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 48px; row-gap: 50px;
  grid-template-areas: "react react react blob" "gateway gateway users redis" ". bus bus bus" "engine engine engine engine" "postgres postgres pool pool";
  background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 48px 34px 48px; box-shadow: var(--shadow); }
.wires { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: visible; }
.area-react { grid-area: react; } .area-blob { grid-area: blob; } .area-gateway { grid-area: gateway; }
.area-bus { grid-area: bus; }
.area-users { grid-area: users; }
.area-engine { grid-area: engine; } .area-redis { grid-area: redis; }
.area-postgres { grid-area: postgres; } .area-pool { grid-area: pool; }
.box { position: relative; z-index: 1; border-radius: var(--radius); border: 2px solid; padding: 10px 12px; cursor: pointer;
  transition: opacity .2s, box-shadow .2s, transform .2s; align-self: start; min-height: 64px; }
.box:hover { box-shadow: 0 0 0 4px rgba(67,56,202,.10); }
.box-head { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 0; background: transparent; padding: 0; text-align: left; width: auto; max-width: 100%; }
.box-name { font-weight: 650; font-size: 15px; }
.box-sub { font-size: 11.5px; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); }
.box-label2 { font-size: 12.5px; font-weight: 600; color: var(--service, #0f766e); margin-top: 2px; }
.g-client { border-color: var(--client); background: var(--client-bg); }
.g-service { border-color: var(--service); background: var(--service-bg); border-width: 3px; }
.g-core { border-color: var(--core); background: var(--core-bg); border-width: 4px; box-shadow: 0 6px 20px rgba(67,56,202,.15); }
.g-core .box-name { font-size: 17px; color: var(--core); }
.g-core .box-sub { color: var(--core); font-weight: 650; }
.g-infra { border-color: var(--infra); background: var(--infra-bg); border-style: dashed; }
.area-bus { min-height: 104px; }
.phone-hint { display: none; }
.bus-lanes { position: absolute; right: 10px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; max-width: 75%; }
.lane-chip { font-size: 11px; border-radius: 6px; padding: 2px 6px; border: 1px solid #d6c8fb; background: #fff; color: #5b21b6; position: relative; z-index: 3; }
.lane-chip.q-events { border-style: dashed; }
.modules { margin-top: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 44px; row-gap: 40px; padding: 10px; border-radius: 10px; background: #fff; border: 1px solid #d9dcf7;
  grid-template-areas: "m-cat m-game m-proj" "note m-sbx ."; }
.area-m-cat { grid-area: m-cat; } .area-m-game { grid-area: m-game; } .area-m-proj { grid-area: m-proj; } .area-m-sbx { grid-area: m-sbx; }
.modules-label { grid-area: note; align-self: center; font-size: 11px; color: var(--core); text-transform: uppercase; letter-spacing: .03em; }
.module { display: flex; flex-direction: column; gap: 1px; }
.module { border: 1.5px dashed var(--core); background: #fafaff; color: var(--core); border-radius: 8px; padding: 6px 8px; font-size: 12.5px; text-align: left; position: relative; z-index: 3; }
.module:hover { background: #eef0ff; }
.module-wide { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.module-tag { font-size: 11px; color: var(--muted); }
.db-schema { border-style: dashed; }
.db { display: inline-block; margin-top: 8px; font-size: 11.5px; border: 1px solid #d9c9a0; background: #fffdf6; color: var(--infra); border-radius: 999px; padding: 2px 9px; position: relative; z-index: 3; }
.db.small { margin: 0; cursor: default; }
.db-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.map.has-hl .box:not(.hl) { opacity: .32; }
.map.has-hl .module:not(.hl) { opacity: .55; }
.box.hl { box-shadow: 0 0 0 4px rgba(250,204,21,.55); }
.module.hl { background: #fef9c3; border-style: solid; }

/* wires */
.wire { pointer-events: auto; cursor: pointer; outline: none; }
.wire .hit { fill: none; stroke: transparent; stroke-width: 14; }
.wire .line { fill: none; stroke-width: 2; stroke-linejoin: round; transition: stroke-width .15s, opacity .2s; }
.wire.k-bus .line { stroke: var(--bus); stroke-dasharray: 6 4; }
.wire.k-http .line { stroke: var(--http); stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
.wire.k-inproc .line { stroke: var(--inproc); stroke-width: 3.5; }
.wire.k-k8s .line { stroke: var(--infra); stroke-width: 2.5; }
.wire.k-rest .line { stroke: var(--client); }
.wire.k-sse .line { stroke: var(--sse); }
.wire.k-cache .line { stroke: #b45309; }
.wire.k-assets .line { stroke: #60a5fa; }
.head.k-bus { fill: var(--bus); } .head.k-http { fill: var(--http); } .head.k-rest, .head.k-sse { fill: var(--client); } .head.k-k8s { fill: var(--infra); } .head.k-assets { fill: #60a5fa; } .head.k-cache { fill: #b45309; } .head.k-inproc { fill: var(--inproc); }
.wire .badge { fill: #fff; stroke: #94a3b8; stroke-width: 1.5; }
.wire .badge-t { font-size: 11px; text-anchor: middle; fill: var(--ink); font-weight: 600; }
.wire:hover .line, .wire:focus .line, .wire.hl .line { stroke-width: 3.5; }
.wire.k-inproc .badge { fill: var(--inproc); stroke: var(--inproc); } .wire.k-inproc .badge-t { fill: #fff; }
.wire.k-inproc.hl .line, .wire.k-inproc:hover .line { stroke-width: 5; } .wire.k-inproc.hl .badge-t { fill: var(--ink); }
.wire:hover .badge, .wire:focus .badge, .wire.hl .badge { fill: #fef9c3; stroke: #ca8a04; }
.map.has-hl .wire:not(.hl) { opacity: .15; }
.conn-list { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; font-size: 14px; }
.conn-list summary { cursor: pointer; color: var(--muted); padding: 4px 0; }
.conn-list ol { margin: 6px 0 4px; padding-left: 22px; }
.conn-list li { margin: 3px 0; }
.conn { border: 0; background: none; padding: 3px 4px; text-align: left; border-radius: 6px; }
.conn:hover, .conn.hl { background: #fef9c3; }

/* ---------- panel ---------- */
.panel { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); max-height: calc(100vh - 24px); overflow: auto; }
.panel-inner { padding: 18px 20px; }
.sheet-handle { display: none; }
.p-bar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 4px; }
.p-head h2, .tour-card h2 { margin: 8px 0 2px; font-size: 20px; letter-spacing: -.01em; }
.p-sub { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; background: #eef1f6; color: var(--muted); }
.t-client { background: var(--client-bg); color: var(--client); } .t-service { background: var(--service-bg); color: var(--service); }
.t-core, .t-module { background: var(--core); color: #fff; } .t-infra { background: var(--infra-bg); color: var(--infra); }
.t-edge.k-cache { background: #fff4e0; color: #9a5b00; } .t-edge.k-inproc { background: var(--inproc); color: #fff; } .t-edge.k-bus { background: #f3edff; color: var(--bus); } .t-edge.k-http { background: #e8ebf0; color: var(--http); }
.t-tour { background: var(--core-bg); color: var(--core); }
.sec { border-top: 1px solid var(--line); padding: 10px 0 4px; }
.sec h3 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.sec p { margin: 0 0 6px; line-height: 1.5; font-size: 15px; }
.sec.why h3 { color: var(--core); }
.missing { color: #9a3412 !important; background: #fff7ed; border-radius: 8px; padding: 6px 8px; font-size: 13.5px !important; }
.related { color: var(--muted); font-size: 13.5px !important; }
.rel-from { font-style: italic; }
.chip-link { display: inline-block; margin: 3px 6px 3px 0; border: 1px solid var(--line); background: #f8fafc; border-radius: 999px; padding: 4px 10px; font-size: 13px; text-align: left; }
.chip-link:hover { border-color: #94a3b8; background: #fff; }
.chip-link.small { font-size: 12px; padding: 3px 8px; }
.module-link { border-style: dashed; border-color: var(--core); color: var(--core); }
.edge-link.k-bus { color: var(--bus); } .edge-link.k-http { color: var(--http); } .edge-link.k-inproc { color: var(--inproc); font-weight: 600; }
.lead { font-size: 15.5px; line-height: 1.55; margin-top: 0; }
.muted { color: var(--muted); font-size: 14px; }
.nav { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 14px; }
.nav.small { padding: 4px 10px; font-size: 13px; }
.nav:disabled { opacity: .4; cursor: default; }
.primary { background: var(--core); color: #fff; border-color: var(--core); }
.reveal { border: 0; border-radius: 10px; padding: 10px 16px; margin: 12px 0 4px; width: 100%; }
.reveal-body { margin-top: 10px; padding: 12px 14px; background: var(--core-bg); border-radius: 12px; font-size: 15.5px; line-height: 1.55; }
.reveal-body p { margin: 0; }
.reveal-body p.note { margin-top: 8px; font-size: 14px; color: var(--muted); }
.opt-note { margin: 2px 0 6px; font-size: 13px; color: #9a3412; }
.tour-top { display: flex; justify-content: space-between; align-items: center; }
.counter { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lit { margin-top: 6px; }
.lit-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.tour-nav { display: flex; justify-content: space-between; margin-top: 16px; gap: 8px; }
.sec code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: #f1f3f6; border-radius: 4px; padding: 0 4px; }

/* ---------- phone ---------- */
@media (max-width: 760px) {
  .top { padding: 12px 14px 6px; }
  .top h1 { font-size: 16px; }
  .headline { font-size: 14px; }
  .modes { width: 100%; justify-content: space-between; }
  .modes button { flex: 1; padding: 8px 6px; font-size: 13.5px; }
  .legend { padding: 4px 14px 8px; font-size: 12px; gap: 4px 12px; }
  .lg-shape { flex-basis: 100%; }
  .layout { grid-template-columns: 1fr; padding: 0 12px 52vh; }
  .map { grid-template-columns: 1fr; row-gap: 12px; padding: 12px;
    grid-template-areas: "react" "blob" "gateway" "users" "bus" "engine" "redis" "postgres" "pool"; }
  .modules { grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; grid-template-areas: "m-game m-game" "m-cat m-sbx" "m-proj m-proj" "note note"; }
  .lg-line { flex-basis: 100%; }
  .wires { display: none; }
  .area-bus { min-height: 0; }
  .bus-lanes { position: static; max-width: none; justify-content: flex-start; margin-top: 8px; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; top: auto; max-height: 62vh; border-radius: 18px 18px 0 0; z-index: 20;
    transform: translateY(105%); transition: transform .25s ease; box-shadow: 0 -8px 30px rgba(15,23,42,.18); }
  .panel:not(.open) { visibility: hidden; transition: transform .25s ease, visibility 0s .25s; }
  .panel.open { transform: translateY(0); visibility: visible; }
  .phone-hint { display: block; margin: 0 2px 8px; font-size: 13.5px; color: var(--muted); }
  .panel-inner { padding: 8px 16px 20px; }
  .sheet-handle { display: block; width: 40px; height: 4px; border-radius: 4px; background: #cbd5e1; margin: 4px auto 8px; }
  .p-bar { position: sticky; top: 0; }
}

</style>
</head>
<body>
<header class="top">
  <div class="top-text">
    <h1 id="title"></h1>
    <p id="headline" class="headline"></p>
  </div>
  <nav class="modes" role="tablist" aria-label="Mode">
    <button id="mode-explore" role="tab" aria-selected="true"></button>
    <button id="mode-tour" role="tab" aria-selected="false"></button>
  </nav>
</header>
<div id="legend" class="legend" aria-label="Legend"></div>
<main class="layout">
  <section class="map-wrap">
    <p id="phone-hint" class="phone-hint"></p>
    <div id="map" class="map">
      <svg id="wires" class="wires" aria-hidden="false"></svg>
    </div>
    <details id="conn-list" class="conn-list"><summary></summary><ol></ol></details>
  </section>
  <aside id="panel" class="panel" aria-live="polite">
    <div class="panel-inner">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div id="panel-body"></div>
    </div>
  </aside>
</main>
<script>
/* All architecture text shown on the page lives in content*.js.
   Source: /workspace/projecton/DESIGN-v2.md (CHANGE SET R+Q3; §1–§5, §7–§9, §11, §12, §14). Wording is copied from it.
   Interface wording (buttons, headings, legend) lives in `ui` and is not an architecture fact.
   This file: title, colour groups, boxes. content-modules.js: modules inside game-engine.
   content-edges.js: numbered arrows. content-flows.js: guided tour. */
window.CONTENT = {
  title: "projecton v2 — how the escape room platform fits together",
  headline: "Three microservices: gateway-api, users and game-engine. game-engine is a modular monolith: its modules (game, projection, catalog, sandbox) call each other in process.",
  subline: "Event Hubs carries only the truly asynchronous flows, player-commands and game-events, and never commands between modules. Besides that there are exactly three direct internal HTTP calls.",

  groups: {
    client: { label: "Client", members: "React app, Blob Storage + CDN" },
    service: { label: "Microservice", members: "gateway-api, users" },
    core: { label: "Core (modular monolith)", members: "game-engine: game, projection, catalog and sandbox modules" },
    infra: { label: "Infrastructure", members: "Azure Event Hubs, Redis, Postgres, sandbox node pool (Kubernetes pods)", note: "infrastructure, like Postgres, not a service" }
  },

  nodes: {
    react: { name: "React app", sub: "browser", group: "client",
      what: "React + TypeScript. xterm.js terminal · SQL box · forms.",
      does: ["Presents state and collects input only. Never touches Postgres, Redis or Event Hubs.",
        "Terminal view: xterm.js, line by line. SQL view: thin: one command box and one result grid.",
        "Copy and paste: every output on screen (terminal, SQL grid, machine outputs, capture viewer) is selectable text the player can copy; every input field accepts paste. Browser clipboard only, no server part."],
      why: "The backend is the judge. It holds the sandboxes, the answers, the clock and the rules, and it decides every outcome. The React frontend only presents state and collects input, so a player cannot cheat by editing the page." },
    blob: { name: "Blob Storage + CDN", sub: "skin images", group: "client",
      what: "Skin images: Blob Storage + CDN, read only by the browser.",
      does: "The experience is built from clickable images (the skin), and the server drives it.",
      why: "The escape room is one Script on the platform. A later game is another Script and another skin over the same services." },
    gateway: { name: "gateway-api", sub: "Microservice 1", group: "service", db: "gateway_db",
      what: "The public front door and edge security. It owns no users.",
      does: ["Its auth module issues tokens at `/auth/*` (access token + rotating refresh token) and does refresh rotation and reuse detection.",
        "On every request it checks the access token, the refresh family (`gateway_db`) and the user's status, role and token version (Redis key `userauth:{userId}`, or the users service on a miss), then checks the role and that the player owns the session.",
        "Validates the command, sends it to Event Hubs and replies 202 (\"received\") at once.",
        "The token's role is for the projection module only.",
        "gateway_db holds refresh tokens only (`refresh_families`, `refresh_tokens`). Refresh rotation and reuse detection are token mechanics, the gateway's job."],
      public: ["Only gateway-api and the projection module's two routes are publicly routed (ingress).",
        "`POST /auth/signup`, `/auth/login`, `/auth/refresh`, `/auth/logout`, `/auth/logout-all`, `GET /me`, `PATCH /me`, `PATCH /me/password`, `GET /admin/users`, `GET /admin/users/:id`, `POST /admin/users`, `PATCH /admin/users/:id/role`, `POST /admin/users/:id/disable`, `/enable`, `DELETE /admin/users/:id`, `GET /health`, `POST /sessions`, `POST /sessions/:sid/puzzles/:key/inputs`, `/hints`, `/reconnect`, `/abandon`, `POST /admin/scripts/:id/versions/:v/publish`."],
      why: "edge security and intake in one place; the player gets an instant reply even if the engine is busy.",
      without: "every service would do auth itself and be public." },
    users: { name: "users", sub: "Microservice 2", group: "service", db: "users_db",
      what: "Users, credentials (argon2id), roles, token version and status.",
      does: ["Called only by gateway-api, over `/internal/*`: `POST /internal/users`, `POST /internal/credentials/verify`, `GET /internal/users/:id/auth-state`, `POST /internal/users/:id/password`, `POST /internal/users/:id/token-version/bump`, `PATCH /internal/users/:id`, and the admin routes under `/internal/admin/users/*`.",
        "Every role, password and disable change bumps tokenVersion. Enable and delete do not bump tokenVersion.",
        "Passwords are stored only as argon2id hashes, by the users service. Plain-text passwords are never stored or logged.",
        "The users service owns `userauth:{userId}` and deletes it after every commit that changes status, role or tokenVersion.",
        "A role change (admin ↔ player) bumps `users.tokenVersion` in the same transaction, and users then deletes `userauth:{userId}`."],
      public: "No. `/internal/*` is cluster-internal only; the ingress never routes it.",
      why: "credentials and identity are kept apart from edge security. Token mechanics (refresh rotation, reuse detection) are the gateway's job; who a user is and what role they have is the users service's job.",
      down: "No login and no refresh. Other requests get 503 once their `userauth` cache entries expire. The 60 s TTL bounds the damage if a key delete is missed." },
    engine: { name: "game-engine", sub: "Microservice 3 · THE CORE", label2: "modular monolith", group: "core", db: "engine_db",
      what: "The brain. A modular monolith whose modules (game, projection, catalog, sandbox) call each other in process.",
      does: ["Runs the Script state machine, owns sessions and puzzle progress, builds puzzles with the Component Factory, checks crypto answers, runs the inbox, outbox and the stuck-session janitor.",
        "Also holds the projection module (the read model), the catalog module (Script versions and Component Templates) and the sandbox module (sandbox pods through the Kubernetes API).",
        "Modules inside game-engine (one process, not separate services): game, projection, catalog and sandbox. They call each other in process; commands between modules never go over Event Hubs. No module reads another module's schema.",
        "engine_db (the projection, catalog and sandbox modules each use their own schema: `projection`, `catalog`, `sandbox`).",
        "The projection and catalog modules are built with a service boundary, so each can be moved into its own service later. The sandbox module is not designed to be moved out."],
      public: "Only the two projection module routes. The ingress routes `GET /sessions/:sid/stream` and `GET /admin/overview` to game-engine.",
      why: "the only place that decides what a move means. Everything else serves it.",
      cost: ["One deploy for game and sandbox: a sandbox bug redeploys the game, and the two scale together.",
        "game-engine has public routes (SSE, admin overview) and also holds pods/exec in `sandboxes`, so a compromise of the engine reaches the sandboxes. Limited by a one-namespace Role, no secrets in that namespace, PSA restricted, the admission rules, a deny-all NetworkPolicy and a quota."] },
    bus: { name: "Azure Event Hubs", sub: "infrastructure · 2 event hubs", group: "infra",
      what: ["Two event hubs in one Event Hubs namespace: player-commands and game-events. They carry only the truly asynchronous flows.",
        "Partitions: 4 per event hub to start. Retention: 7 days."],

    { text: "Every call carries the Bearer access token. gateway-api's guard checks signature, iss, aud and exp, then the family in gateway_db (neither revoked nor expired) and the user's state from userauth:{userId} in Redis (on a miss, from users GET /internal/users/:id/auth-state): the user is active and tokenVersion equals ver. It takes the role from that state, then checks the role, then the owner. If gateway_db, or users on a cache miss, is unreachable it returns 503.",
      note: "A role change (admin ↔ player) bumps users.tokenVersion in the same transaction, and users then deletes userauth:{userId}. gateway-api then rejects old tokens at once, the refresh family dies, and the next login carries the new role.",
      hl: ["react", "gateway", "redis", "users", "postgres"], edges: ["e2", "e14", "e7", "e15"] },
    { text: "The projection module in game-engine verifies the same access token on the SSE stream and on GET /admin/overview with JWT_ACCESS_SECRET, JWT_ISSUER and JWT_AUDIENCE, and does not call gateway-api. Checking a JWT is local, so it adds no call.",
      note: "The projection module does not check the current role with users, so a demoted admin can still read /admin/overview until the token expires, at most 15 min (JWT_ACCESS_TTL). Accepted: read-only aggregate counts, no user data.",

    { text: "A sandbox worker in the sandbox module claims the job, then creates the pod through the Kubernetes API, runs the seed script and the ready probe.", hl: ["engine", "m-sbx", "pool"], edges: ["e13"] },

  { id: "F2", title: "Normal sandbox command", steps: [

    { text: "The sandbox module claims the destroy jobs and deletes the pods.", hl: ["engine", "m-sbx", "pool"], edges: ["e13"] },

  { id: "F7", optional: true, title: "Admin publishes a Script version", steps: [
    { text: "Admin (React app) POST /admin/scripts/:id/versions/:v/publish -> gateway-api: JWT + fresh admin role (users) -> direct HTTP publish -> game-engine (catalog module).",
      note: "Publish stays behind the gateway on purpose: it is a write, so it uses the fresh role from the users service, not the role claim in the token, which can be up to 15 min old.", hl: ["react", "gateway", "users", "engine", "m-cat"], edges: ["e2", "e9"] },
    { text: "The catalog module validates: the version must be a draft; the definition parses; every state is reachable from initialState; a final state is reachable from every state; every templateRef exists with status published; no opensAfter cycles.", hl: ["engine", "m-cat"], edges: [] },
    { text: "The catalog module commits status + publishedAt and answers 200 valid, or 422 invalid + errors -> gateway-api -> admin. No Redis delete and no event.", hl: ["engine", "m-cat", "postgres", "gateway"], edges: ["e9"] },
    { text: "New sessions read the new current version; running sessions keep theirs.", hl: ["engine", "m-cat", "m-game"], edges: [] } ] },
  { id: "F8", optional: true, title: "Admin overview", steps: [
    { text: "The admin page (React app) calls GET /admin/overview. The ingress routes it to game-engine, where the projection module serves it directly, not through gateway-api.", hl: ["react", "engine", "m-proj"], edges: [] },

    { text: "The projection module reads admin:overview from Redis and returns the overview.", hl: ["engine", "m-proj", "redis"], edges: ["e16"] },
    { text: "On a miss or when Redis is down, the projection module computes the overview from session_view and puzzle_stats (its projection schema), stores it in admin:overview and returns it. Postgres stays the source of truth.", hl: ["engine", "m-proj", "postgres", "redis"], edges: ["e16"] },

    { text: "What the key holds: gamesInProgress (live count of Active sessions); gamesFinishedToday (escaped, expired, abandoned); per puzzle avgSolveSeconds, wrongAttempts (CommandEvaluated with verdict rejected and reason wrongAnswer), ruinResets (PuzzleReset events) and hintsUsed (HintRevealed with firstTime = true).", hl: ["engine", "m-proj", "redis"], edges: ["e16"] } ] },

    { text: "No current hint -> CommandEvaluated with verdict rejected and reason noHint; the screen says \"No hint for this step\". It does not count as a wrong attempt.", hl: ["engine", "m-proj", "react"], edges: ["e6", "e3"] },

<script>
/* Builds the map (boxes + wires) from CONTENT. Exposes window.MapView. */
(function () {
  var C = window.CONTENT;
  var NS = "http://www.w3.org/2000/svg";
  var ORDER = ["react", "blob", "gateway", "users", "bus", "engine", "redis", "postgres", "pool"];
  var KINDS = ["rest", "sse", "assets", "bus", "http", "inproc", "k8s", "cache"];
  var onSelect = function () {};

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function chip(cls, label, target, kind) {
    var b = el("button", cls, label);
    b.type = "button";
    b.dataset.target = target;
    b.dataset.kind = kind;
    return b;
  }

  function buildBox(id) {
    var n = C.nodes[id];
    var box = el("div", "box g-" + n.group + " area-" + id);
    box.dataset.id = id;
    var head = chip("box-head", "", id, "node");
    head.appendChild(el("span", "box-name", n.name));
    if (n.sub) head.appendChild(el("span", "box-sub", n.sub));
    if (n.label2) head.appendChild(el("span", "box-label2", n.label2));
    box.appendChild(head);
    if (id === "engine") {
      var mods = el("div", "modules");
      mods.appendChild(el("div", "modules-label", C.ui.modules));
      Object.keys(C.modules).forEach(function (mid) {
        var mo = C.modules[mid], m = chip("module area-" + mid, mo.name + " module", mid, "module");
        m.dataset.id = mid;
        if (mo.tag) m.appendChild(el("span", "module-tag", mo.tag));
        mods.appendChild(m);
      });
      box.appendChild(mods);
    }
    if (id === "bus") {
      var q = el("div", "bus-lanes");
      C.edges.forEach(function (e) {
        if (e.kind === "bus") {
          var b = chip("lane-chip q-" + e.carries, e.hub, e.id, "edge");
          q.appendChild(b);
        }
      });
      box.appendChild(q);
    }
    if (n.db) box.appendChild(chip("db", n.db, "postgres", "node"));
    if (id === "postgres") {
      var dbs = el("div", "db-row");
      ["gateway_db", "users_db", "engine_db"].forEach(function (d) { dbs.appendChild(el("span", "db small", d)); });
      ["catalog schema", "sandbox schema", "sandbox_jobs", "projection schema"].forEach(function (d) {
        dbs.appendChild(el("span", "db small db-schema", d + (d === "sandbox_jobs" ? " (sandbox schema)" : " (in engine_db)")));
      });
      box.appendChild(dbs);
    }
    box.addEventListener("click", function (ev) {
      var t = ev.target.closest("[data-target]");
      if (t) onSelect(t.dataset.kind, t.dataset.target);
      else onSelect("node", id);
    });
    return box;
  }

  function build(map, handler) {
    onSelect = handler;
    ORDER.forEach(function (id) { map.appendChild(buildBox(id)); });
  }

  /* ---------- wires (desktop only) ---------- */
  function box(r, m) {
    var x = r.left - m.left, y = r.top - m.top;
    return { l: x, t: y, r: x + r.width, b: y + r.height, w: r.width, h: r.height, cx: x + r.width / 2, cy: y + r.height / 2 };
  }
  function rel(map, sel) { return box(map.querySelector(sel).getBoundingClientRect(), map.getBoundingClientRect()); }
  function fx(b, f) { return b.l + b.w * f; }
  function v(x, y1, y2) { return [[x, y1], [x, y2]]; }

  /* Orthogonal routes in map pixels. seg = index of the segment that carries the number badge. */
  function routes(map) {
    var R = {};
    ORDER.forEach(function (id) { R[id] = rel(map, '.box[data-id="' + id + '"]'); });
    ["m-game", "m-proj", "m-cat", "m-sbx"].forEach(function (id) { R[id] = rel(map, '.module[data-id="' + id + '"]'); });
    var RE = R.react, BL = R.blob, G = R.gateway, U = R.users, RD = R.redis, B = R.bus, E = R.engine, PL = R.pool;
    var MG = R["m-game"], MP = R["m-proj"], MC = R["m-cat"], MS = R["m-sbx"];
    var gapA = RE.b + 14, gapB = RE.b + 32, lane0 = B.t + 64, lane1 = B.t + 84, y34 = (B.b + E.t) / 2;
    var leftX = G.l - 18, outX1 = RD.r + 14, outX2 = RD.r + 32;
    var e5x = B.l - 22, e8x = fx(G, 0.3), g8 = fx(MG, 0.18), g5 = fx(MG, 0.5), g6 = fx(MG, 0.82);
    var gu = (Math.max(G.t, U.t) + Math.min(G.b, U.b)) / 2, ur = (Math.max(U.t, RD.t) + Math.min(U.b, RD.b)) / 2;
    var ox = (Math.max(MS.l, PL.l) + Math.min(MS.r, PL.r)) / 2;
    var e13 = ox > Math.max(MS.l, PL.l) ? v(ox, MS.b, PL.t)
      : [[MS.cx, MS.b], [MS.cx, (E.b + PL.t) / 2], [fx(PL, 0.2), (E.b + PL.t) / 2], [fx(PL, 0.2), PL.t]];
    var pts = {
      e1: v(fx(G, 0.3), RE.b, G.t),
      e2: v(fx(G, 0.55), RE.b, G.t),
      e3: [[MP.r, MP.cy + 8], [outX2, MP.cy + 8], [outX2, gapA], [RE.r - 30, gapA], [RE.r - 30, RE.b]],
      e4: [[RE.r, RE.t + RE.h * 0.45], [BL.l, RE.t + RE.h * 0.45]],
      e5: [[e5x, G.b], [e5x, lane0], [g5, lane0], [g5, MG.t]],
      e6: [[g6, MG.t], [g6, lane1], [MP.cx, lane1], [MP.cx, MP.t]],
      e7: [[G.r, gu], [U.l, gu]],
      e8: [[e8x, G.b], [e8x, y34], [g8, y34], [g8, MG.t]],
      e9: [[G.l, G.t + G.h * 0.7], [leftX, G.t + G.h * 0.7], [leftX, MC.cy], [MC.l, MC.cy]],
      e10: [[MG.l, MG.cy], [MC.r, MG.cy]],
      e11: v(fx(MG, 0.35), MG.b, MS.t),
      e12: v(fx(MG, 0.65), MS.t, MG.b),
      e13: e13,
      e14: [[fx(G, 0.92), G.t], [fx(G, 0.92), gapB], [RD.cx, gapB], [RD.cx, RD.t]],
      e15: [[U.r, ur], [RD.l, ur]],
      e16: [[MP.r, MP.cy - 8], [outX1, MP.cy - 8], [outX1, RD.cy], [RD.r, RD.cy]]
    };
    var seg = { e1: 0, e2: 0, e3: 1, e4: 0, e5: 1, e6: 1, e7: 0, e8: 1, e9: 2, e10: 0, e11: 0, e12: 0, e13: e13.length > 2 ? 1 : 0, e14: 1, e15: 0, e16: 1 };
    return { pts: pts, seg: seg };
  }

  function draw(map, svg) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var mr = map.getBoundingClientRect();
    svg.setAttribute("width", mr.width);
    svg.setAttribute("height", mr.height);
    svg.setAttribute("viewBox", "0 0 " + mr.width + " " + mr.height);
    var defs = document.createElementNS(NS, "defs");
    KINDS.forEach(function (k) {
      var mk = document.createElementNS(NS, "marker");
      mk.setAttribute("id", "arrow-" + k);
      mk.setAttribute("viewBox", "0 0 10 10");
      mk.setAttribute("refX", "9"); mk.setAttribute("refY", "5");
      var sz = k === "inproc" ? "4" : "7"; mk.setAttribute("markerWidth", sz); mk.setAttribute("markerHeight", sz);
      mk.setAttribute("orient", "auto-start-reverse");
      var p = document.createElementNS(NS, "path");
      p.setAttribute("d", "M0,0 L10,5 L0,10 z");
      p.setAttribute("class", "head k-" + k);
      mk.appendChild(p); defs.appendChild(mk);
    });
    svg.appendChild(defs);
    var r = routes(map);
    C.edges.forEach(function (e, i) {
      var pts = r.pts[e.id];
      var d = pts.map(function (p, j) { return (j ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
      var g = document.createElementNS(NS, "g");
      g.setAttribute("class", "wire k-" + e.kind);
      g.dataset.edge = e.id;
      g.setAttribute("tabindex", "0");
      g.setAttribute("role", "button");
      g.setAttribute("aria-label", e.text);
      var t = document.createElementNS(NS, "title"); t.textContent = e.text; g.appendChild(t);
      var hit = document.createElementNS(NS, "path"); hit.setAttribute("d", d); hit.setAttribute("class", "hit");
      var vis = document.createElementNS(NS, "path"); vis.setAttribute("d", d); vis.setAttribute("class", "line");
      vis.setAttribute("marker-end", "url(#arrow-" + e.kind + ")");
      var s = r.seg[e.id], a = pts[s], b = pts[s + 1];
      var bx = (a[0] + b[0]) / 2, by = (a[1] + b[1]) / 2;
      var c = document.createElementNS(NS, "circle"); c.setAttribute("cx", bx); c.setAttribute("cy", by); c.setAttribute("r", 10); c.setAttribute("class", "badge");
      var tx = document.createElementNS(NS, "text"); tx.setAttribute("x", bx); tx.setAttribute("y", by + 4); tx.setAttribute("class", "badge-t"); tx.textContent = String(i + 1);
      g.appendChild(hit); g.appendChild(vis); g.appendChild(c); g.appendChild(tx);
      g.addEventListener("click", function (ev) { ev.stopPropagation(); onSelect("edge", e.id); });
      g.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); onSelect("edge", e.id); } });
      svg.appendChild(g);
    });
  }

  function highlight(map, nodes, edges) {
    nodes = nodes || []; edges = edges || [];
    var any = nodes.length || edges.length;
    map.classList.toggle("has-hl", !!any);
    map.querySelectorAll(".box, .module").forEach(function (b) {
      b.classList.toggle("hl", nodes.indexOf(b.dataset.id) >= 0);
    });
    document.querySelectorAll("[data-edge-ref], .wire, .lane-chip").forEach(function (w) {
      var id = w.dataset.edge || w.dataset.edgeRef || w.dataset.target;
      w.classList.toggle("hl", edges.indexOf(id) >= 0);
    });
  }

  window.MapView = { build: build, draw: draw, highlight: highlight, ORDER: ORDER };
})();

</script>
<script>
/* Renders panel contents (details, tour card). Exposes window.Panel. */
(function () {
  var C = window.CONTENT, U = C.ui;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  /* `code` spans in content text render as <code>. */
  function rich(tag, cls, text) {
    var e = el(tag, cls);
    String(text).split("`").forEach(function (part, i) { e.appendChild(i % 2 ? el("code", null, part) : document.createTextNode(part)); });
    return e;
  }
  function link(label, kind, target, cls) {
    var b = el("button", "link " + (cls || ""), label);
    b.type = "button"; b.dataset.go = kind; b.dataset.target = target;
    return b;
  }
  function nameOf(id) { return C.nodes[id] ? C.nodes[id].name : (C.modules[id] ? C.modules[id].name : id); }
  function edge(id) { return C.edges.filter(function (e) { return e.id === id; })[0]; }
  function edgeNo(id) { return C.edges.indexOf(edge(id)) + 1; }
  /* An arrow end inside game-engine reads "game-engine (projection module)". */
  function endName(id) { return C.modules[id] ? C.nodes.engine.name + " (" + C.modules[id].name + " module)" : nameOf(id); }
  function kindOf(id) { return C.modules[id] ? "module" : "node"; }
  function edgeTitle(e) { return edgeNo(e.id) + ". " + endName(e.from) + " → " + endName(e.to); }
  function touches(e, id) { return [e.from, e.to].some(function (x) { return x === id || (id === "engine" && C.modules[x]); }); }
  function connections(id) {
    var es = C.edges.filter(function (e) { return touches(e, id); });
    if (!es.length) return null;
    var c = el("section", "sec");
    c.appendChild(el("h3", null, U.connectsTo));
    es.forEach(function (e) { c.appendChild(link(edgeTitle(e), "edge", e.id, "chip-link edge-link k-" + e.kind)); });
    return c;
  }

  function section(title, value, related, cls) {
    var s = el("section", "sec " + (cls || ""));
    s.appendChild(el("h3", null, title));
    var vals = Array.isArray(value) ? value : [value];
    if (value == null) s.appendChild(el("p", "missing", U.missing));
    else vals.forEach(function (v) { s.appendChild(rich("p", null, v)); });
    if (related) {
      var r = el("p", "related");
      r.appendChild(el("span", "rel-from", U.relatedFrom + " " + related.from + ": "));
      r.appendChild(document.createTextNode("“" + related.text + "”"));
      s.appendChild(r);
    }
    return s;
  }

  function header(tag, tagCls, title, sub) {
    var h = el("div", "p-head");
    h.appendChild(el("span", "tag " + tagCls, tag));
    h.appendChild(el("h2", null, title));
    if (sub) h.appendChild(el("p", "p-sub", sub));
    return h;
  }

  function node(id) {
    var n = C.nodes[id], f = el("div", "detail");
    f.appendChild(header(C.groups[n.group].label, "t-" + n.group, n.name, n.sub));
    f.appendChild(section(U.what, n.what, null));
    f.appendChild(section(U.does, n.does, null));
    if (n.public) f.appendChild(section(U.publicRoutes, n.public, null));
    f.appendChild(section(U.why, n.why, n.why == null ? n.related : null, "why"));
    if (n.without) f.appendChild(section(U.without, n.without, null, "why"));
    if (n.down) f.appendChild(section(U.down, n.down, null));
    if (n.cost) f.appendChild(section(U.cost, n.cost, null));
    if (n.usedBy) f.appendChild(section(U.usedBy, n.usedBy, null));
    if (n.terminal) f.appendChild(section(U.terminalLabel, n.terminal, null));
    if (n.demo) f.appendChild(section(U.demoLabel, n.demo, null));
    if (id === "engine") {
      var m = el("section", "sec");
      m.appendChild(el("h3", null, U.modules));
      Object.keys(C.modules).forEach(function (mid) { m.appendChild(link(C.modules[mid].name, "module", mid, "chip-link module-link")); });
      f.appendChild(m);
    }
    var c = connections(id);
    if (c) f.appendChild(c);
    return f;
  }

  function module(id) {
    var m = C.modules[id], f = el("div", "detail");
    f.appendChild(header(C.groups.core.label, "t-module", m.name, C.nodes.engine.name));
    f.appendChild(section(U.what, m.what ? [C.moduleWhat, m.what] : C.moduleWhat));
    f.appendChild(section(U.does, m.does));
    f.appendChild(section(U.why, m.why || null, null, "why"));
    if (m.terminal) f.appendChild(section(U.terminalLabel, m.terminal, null));
    if (m.cost) f.appendChild(section(U.cost, m.cost, null));
    if (m.demo) f.appendChild(section(U.demoLabel, m.demo, null));
    var c = connections(id);
    if (c) f.appendChild(c);
    var s = el("section", "sec"); s.appendChild(link("← " + C.nodes.engine.name, "node", "engine", "chip-link"));
    f.appendChild(s);
    return f;
  }

  function edgeDetail(id) {
    var e = edge(id), f = el("div", "detail");
    f.appendChild(header(C.kindNames[e.kind], "t-edge k-" + e.kind, edgeTitle(e), null));
    var what = [e.text];
    if (e.kind === "bus") what.push(e.hubNote + " " + C.hubCommon);
    if (e.kind === "http") what.push(C.httpNote);
    if (e.kind === "inproc") what.push(C.inprocNote);
    f.appendChild(section(U.what, what));
    f.appendChild(section(U.does, e.does || e.label + "."));
    var ws = section(U.why, e.kind === "bus" ? [e.why, C.hubWhy] : (e.why || null), null, "why");
    f.appendChild(ws);
    var ends = el("section", "sec");
    ends.appendChild(link(endName(e.from), kindOf(e.from), e.from, "chip-link"));
    ends.appendChild(link(endName(e.to), kindOf(e.to), e.to, "chip-link"));
    if (e.kind === "bus") ends.appendChild(link(C.nodes.bus.name, "node", "bus", "chip-link"));
    f.appendChild(ends);
    return f;
  }

  function hint() {
    var f = el("div", "detail hint");
    f.appendChild(el("p", "lead", C.subline));
    f.appendChild(el("p", "muted", U.hint));
    return f;
  }

  function tour(stepObj, flow, idx, total, flowIdx, flowLen, revealed) {
    var f = el("div", "detail tour-card");
    var top = el("div", "tour-top");
    top.appendChild(el("span", "tag t-tour", (flow.id === "intro" ? U.tour : flow.id) + (flow.optional ? " · " + U.optional : "")));
    top.appendChild(el("span", "counter", U.stepOf + " " + (idx + 1) + " " + U.of + " " + total));
    f.appendChild(top);
    f.appendChild(el("h2", null, flow.title));
    if (flow.optional && !flow.first && flowIdx === 0) f.appendChild(el("p", "opt-note", U.optionalNote));
    f.appendChild(el("p", "p-sub", (stepObj.label ? stepObj.label : (flowLen > 1 ? (flowIdx + 1) + " / " + flowLen : ""))));
    var lit = el("div", "lit");
    lit.appendChild(el("span", "lit-label", U.lit));
    stepObj.hl.forEach(function (h) { lit.appendChild(link(nameOf(h), C.modules[h] ? "module" : "node", h, "chip-link small")); });
    stepObj.edges.forEach(function (x) { lit.appendChild(link("→ " + edgeTitle(edge(x)), "edge", x, "chip-link small edge-link k-" + edge(x).kind)); });
    f.appendChild(lit);
    var body = el("div", "reveal-body" + (revealed ? " shown" : ""));
    body.id = "reveal-body";
    body.appendChild(el("p", null, stepObj.text));
    if (stepObj.note) body.appendChild(el("p", "note", stepObj.note));
    if (!revealed) {
      var rb = el("button", "primary reveal", U.reveal); rb.type = "button"; rb.id = "reveal-btn";
      f.appendChild(rb);
    } else f.appendChild(body);
    var nav = el("div", "tour-nav");
    var back = el("button", "nav", "← " + U.back); back.id = "tour-back"; back.type = "button"; back.disabled = idx === 0;
    var next = el("button", "nav primary", U.next + " →"); next.id = "tour-next"; next.type = "button"; next.disabled = idx === total - 1;
    nav.appendChild(back); nav.appendChild(next);
    f.appendChild(nav);
    return f;
  }

  window.Panel = { node: node, module: module, edge: edgeDetail, hint: hint, tour: tour, edgeTitle: edgeTitle, nameOf: nameOf };
})();

</script>
<script>
/* Wires modes, selection, tour and responsive sheet together. */
(function () {
  var C = window.CONTENT, U = C.ui, P = window.Panel, M = window.MapView;
  var map = document.getElementById("map"), svg = document.getElementById("wires");
  var panel = document.getElementById("panel"), body = document.getElementById("panel-body");
  var state = { mode: "explore", view: "hint", sel: null, tourIdx: 0, revealed: false };

  /* Flatten the flows into one list of tour steps. */
  var steps = [];
  C.flows.forEach(function (f) { f.steps.forEach(function (s, i) { steps.push({ flow: f, step: s, i: i, n: f.steps.length }); }); });

  function text(id, t) { document.getElementById(id).textContent = t; }
  text("title", C.title); text("headline", C.headline);
  text("mode-explore", U.explore); text("mode-tour", U.tour); text("phone-hint", U.hint);

  /* Legend: colour groups + shape key */
  var lg = document.getElementById("legend");
  ["client", "service", "core", "infra"].forEach(function (g) {
    var it = document.createElement("span"); it.className = "lg-item";
    var sw = document.createElement("i"); sw.className = "sw g-" + g;
    it.appendChild(sw); it.appendChild(document.createTextNode(C.groups[g].label));
    it.title = C.groups[g].members + (C.groups[g].note ? " (" + C.groups[g].note + ")" : "");
    lg.appendChild(it);
  });
  [["shape-ms", U.legendShape1], ["shape-mod", U.legendShape2], ["shape-infra", U.legendShape3]].forEach(function (s) {
    var it = document.createElement("span"); it.className = "lg-item lg-shape";
    var sw = document.createElement("i"); sw.className = "sw " + s[0];
    it.appendChild(sw); it.appendChild(document.createTextNode(s[1])); lg.appendChild(it);
  });
  /* Line key: how an arrow is drawn tells you how the call travels. */
  [["inproc", U.legendInproc], ["bus", U.legendBus], ["http", U.legendHttp]].forEach(function (s) {
    var it = document.createElement("span"); it.className = "lg-item lg-line";
    var sw = document.createElement("i"); sw.className = "ln ln-" + s[0];
    it.appendChild(sw); it.appendChild(document.createTextNode(s[1])); lg.appendChild(it);
  });

  /* Connection list (always used on phone; collapsible on desktop) */
  var cl = document.getElementById("conn-list");
  cl.querySelector("summary").textContent = U.connections + " (" + C.edges.length + ")";
  var ol = cl.querySelector("ol");
  C.edges.forEach(function (e) {
    var li = document.createElement("li");
    var b = document.createElement("button"); b.type = "button"; b.className = "conn k-" + e.kind;
    b.dataset.edgeRef = e.id; b.textContent = P.edgeTitle(e).replace(/^\d+\. /, "");
    b.addEventListener("click", function () { select("edge", e.id); });
    li.appendChild(b); ol.appendChild(li);
  });

  function isPhone() { return window.matchMedia("(max-width: 760px)").matches; }

  function render() {
    body.innerHTML = "";
    var v = state.view, frag;
    if (v === "detail") {
      frag = state.sel.kind === "node" ? P.node(state.sel.id) : state.sel.kind === "module" ? P.module(state.sel.id) : P.edge(state.sel.id);
      var bar = document.createElement("div"); bar.className = "p-bar";
      if (state.mode === "tour") bar.appendChild(btn("← " + U.backToTour, "back-tour", closeDetail));
      bar.appendChild(btn("✕", "close-panel", closeDetail, U.close));
      body.appendChild(bar);
    } else if (v === "tour") {
      var s = steps[state.tourIdx];
      frag = P.tour(s.step, s.flow, state.tourIdx, steps.length, s.i, s.n, state.revealed);
    } else frag = P.hint();
    body.appendChild(frag);
    panel.classList.toggle("open", v !== "hint");
    panel.dataset.view = v;
    panel.scrollTop = 0; body.parentNode.scrollTop = 0;
    applyHighlight();
  }

  function btn(label, id, fn, aria) {
    var b = document.createElement("button"); b.type = "button"; b.id = id; b.className = "nav small";
    b.textContent = label; if (aria) b.setAttribute("aria-label", aria);
    b.addEventListener("click", fn); return b;
  }

  function applyHighlight() {
    if (state.view === "detail") {
      var s = state.sel;
      if (s.kind === "edge") {
        var e = C.edges.filter(function (x) { return x.id === s.id; })[0];
        var ends = [e.from, e.to].concat(e.kind === "bus" ? ["bus"] : []);
        if (C.modules[e.from] || C.modules[e.to]) ends.push("engine");
        M.highlight(map, ends, [s.id]);
      } else M.highlight(map, s.kind === "module" ? ["engine", s.id] : [s.id], []);
    } else if (state.view === "tour") {
      var st = steps[state.tourIdx].step; M.highlight(map, st.hl, st.edges);
      var first = isPhone() && map.querySelector(".box.hl");
      if (first) window.scrollTo({ top: first.getBoundingClientRect().top + window.scrollY - 8, behavior: "instant" });
    } else M.highlight(map, [], []);
  }

  function select(kind, id) {
    state.sel = { kind: kind, id: id }; state.view = "detail"; render();
  }
  function closeDetail() {
    state.view = state.mode === "tour" ? "tour" : "hint"; render();
  }
  function setMode(m) {
    state.mode = m; state.view = m === "tour" ? "tour" : "hint"; state.revealed = false;
    document.getElementById("mode-explore").setAttribute("aria-selected", m === "explore");
    document.getElementById("mode-tour").setAttribute("aria-selected", m === "tour");
    document.body.dataset.mode = m;
    render();
  }
  function go(delta) {
    var n = state.tourIdx + delta;
    if (n < 0 || n >= steps.length) return;
    state.tourIdx = n; state.revealed = false; state.view = "tour"; render();
  }

  body.addEventListener("click", function (ev) {
    var t = ev.target.closest("button"); if (!t) return;
    if (t.id === "reveal-btn") { state.revealed = true; render(); return; }
    if (t.id === "tour-next") return go(1);
    if (t.id === "tour-back") return go(-1);
    if (t.dataset.go) select(t.dataset.go, t.dataset.target);
  });

  document.getElementById("mode-explore").addEventListener("click", function () { setMode("explore"); });
  document.getElementById("mode-tour").addEventListener("click", function () { setMode("tour"); });

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && state.view !== "hint" && state.view !== "tour") return closeDetail();
    if (state.mode !== "tour" || state.view !== "tour") return;
    if (ev.key === "ArrowRight") { ev.preventDefault(); go(1); }
    else if (ev.key === "ArrowLeft") { ev.preventDefault(); go(-1); }
    else if ((ev.key === "Enter" || ev.key === " ") && !state.revealed && document.activeElement === document.body) { ev.preventDefault(); state.revealed = true; render(); }
  });

  M.build(map, select);
  function redraw() { if (!isPhone()) M.draw(map, svg); else while (svg.firstChild) svg.removeChild(svg.firstChild); applyHighlight(); }
  var raf; window.addEventListener("resize", function () { cancelAnimationFrame(raf); raf = requestAnimationFrame(redraw); });
  if (isPhone()) cl.open = true;
  setMode("explore");
  redraw();
  window.__explainer = { steps: steps, state: state };
})();

</script>
</body>
