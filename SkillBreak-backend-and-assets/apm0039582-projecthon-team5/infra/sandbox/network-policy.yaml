apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-default-deny
  namespace: team5-sandboxes
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: preflight-target-ingress
  namespace: team5-sandboxes
spec:
  podSelector:
    matchLabels:
      team5.preflight-target: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: team5-sandbox-probes
      ports:
        - protocol: TCP
          port: 18080
