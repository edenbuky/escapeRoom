apiVersion: v1
kind: Namespace
metadata:
  name: skillbreak-engine
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-worker
  namespace: skillbreak-engine
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-worker
  namespace: team5-sandboxes
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-worker
  namespace: team5-sandboxes
subjects:
  - kind: ServiceAccount
    name: sandbox-worker
    namespace: skillbreak-engine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-preflight
  namespace: team5-sandbox-probes
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-preflight
  namespace: team5-sandbox-probes
subjects:
  - kind: ServiceAccount
    name: sandbox-worker
    namespace: skillbreak-engine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-preflight
