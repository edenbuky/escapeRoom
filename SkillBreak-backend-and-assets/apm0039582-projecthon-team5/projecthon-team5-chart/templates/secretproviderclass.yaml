{{- if .Values.secrets.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: projecthon-team5-spc
  labels:
    app.kubernetes.io/name: projecthon-team5
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  provider: azure
  parameters:
    cloudName: AzurePublicCloud
    keyvaultName: {{ .Values.azure.keyVaultName }}
    objects: |
      array:
      {{- range .Values.secrets.mntVolSecretObjects }}
        - |
          objectName: {{ .keyVaultSecretName }}
          objectAlias: {{ .secretAlias }}
          objectType: secret
      {{- end }}
      {{- range .Values.secrets.envSecretObjects }}
        - |
          objectName: {{ .keyVaultSecretName }}
          objectType: secret
      {{- end }}
    resourceGroup: {{ .Values.azure.resourceGroup }}
    subscriptionId: {{ .Values.azure.subscriptionId }}
    tenantId: {{ .Values.azure.tenantId }}
    usePodIdentity: "{{ .Values.azure.usePodIdentity }}"
    useVMManagedIdentity: "{{ .Values.azure.useVMManagedIdentity }}"
    userAssignedIdentityID: "{{ .Values.azure.userAssignedIdentityID }}"
  secretObjects:
  {{- /* Group by k8sSecretName: one secretObject per Secret, many keys inside.
         Emitting one entry per key silently drops all but one. */}}
  {{- $objects := .Values.secrets.envSecretObjects }}
  {{- $names := list }}
  {{- range $objects }}
  {{- $names = append $names .k8sSecretName }}
  {{- end }}
  {{- range $name := ($names | uniq) }}
  - secretName: {{ $name }}
    type: Opaque
    data:
    {{- range $objects }}
    {{- if eq .k8sSecretName $name }}
    - objectName: {{ .keyVaultSecretName }}
      key: {{ .envKey }}
    {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
