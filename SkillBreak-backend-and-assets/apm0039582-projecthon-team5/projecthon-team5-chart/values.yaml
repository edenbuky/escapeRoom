replicaCount: 1

image:
  # The RevUp deploy action injects the full image reference (repository + tag)
  # into this field at deploy time via --set image.repository=<full-ref>.
  # Do NOT append a separate tag in the deployment template.
  repository:
  pullPolicy: IfNotPresent
  pullSecret: jfrog-registry

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env: []

#+--------------------+
#|    Azure KeyVault  |
#+--------------------+
azure:
  resourceGroup: 'tdp-wst2-dev-app-aks-rg'
  subscriptionId: '8013e038-2f5d-4743-ae0b-fc6e68569fcb'
  tenantId: 'e741d71c-c6b6-47b0-803c-0f3b32b07556'
  keyVaultName: 'tdp-2026'
  usePodIdentity: false
  useVMManagedIdentity: true
  userAssignedIdentityID: '4e255304-1102-4ede-9a5b-2548154d25b9'

#+--------------------+
#|    Secrets         |
#+--------------------+
# Populated via Azure Key Vault (Secrets Store CSI Driver)
secrets:
  enabled: false
  # Secrets mounted as files in the CSI volume (e.g. certs, keys)
  mntVolSecretObjects: []
  #  - keyVaultSecretName: exampleSecret
  #    secretAlias: example.secret

  # Secrets exposed to the container as environment variables
  envSecretObjects: []
  #  - keyVaultSecretName: applicationinsights-connection-string
  #    envKey: APPLICATIONINSIGHTS_CONNECTION_STRING
  #    k8sSecretName: projecthon-team5-secrets
  #  - keyVaultSecretName: tdp2026-db-user
  #    envKey: DB_USER
  #    k8sSecretName: projecthon-team5-secrets
  #  - keyVaultSecretName: tdp2026-db-password
  #    envKey: DB_PASSWORD
  #    k8sSecretName: projecthon-team5-secrets

