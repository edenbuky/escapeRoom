replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

#+--------------------+
#|    Secrets         |
#+--------------------+
secrets:
  enabled: true
  mntVolSecretObjects: []
  envSecretObjects:
    - keyVaultSecretName: applicationinsights-connection-string
      envKey: APPLICATIONINSIGHTS_CONNECTION_STRING
      k8sSecretName: projecthon-team5-secrets
    - keyVaultSecretName: tdp2026-db-user
      envKey: DB_USER
      k8sSecretName: projecthon-team5-secrets
    - keyVaultSecretName: tdp2026-db-password
      envKey: DB_PASSWORD
      k8sSecretName: projecthon-team5-secrets

#+--------------------+
#|    Non-secret DB connection info (plain env)
#+--------------------+
env:
  - name: DB_HOST
    value: 'tdp-westus2-dev-flexible-pg.postgres.database.azure.com'
  - name: DB_PORT
    value: '5432'
  - name: DB_NAME
    value: 'tdp-2026-db'
  - name: DB_SSL
    value: 'true'
