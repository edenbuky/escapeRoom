name: projecthon-team5 - CI

on:
  #schedule:
  #  - cron: '00 02 * * *'

  push:
    branches: [ "main" ]
    paths-ignore:
      - '.github/**'
      - 'qualitygate/**'

  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "main" ]

  workflow_dispatch:
    ## This workflow can be manually triggered via the GitHub UI.
    ## The inputs defined below determine the steps to execute.
    ## The `default` value specifies the initial option displayed in the UI only.
    inputs:
      enable_sonar:
        description: 'Enable Sonar'
        default: true
        required: true
        type: boolean
      enable_veracode_sast:
        description: 'Enable VeraCode SAST'
        default: false
        required: true
        type: boolean
      enable_veracode_sca:
        description: 'Enable VeraCode SCA'
        default: false
        required: false
        type: boolean
      enable_cypress_tests:
        description: 'Enable Cypress'
        default: false
        required: true
        type: boolean
      enable_playwright_tests:
        description: 'Enable Playwright'
        default: false
        required: false
        type: boolean
      enable_deployment:
        description: 'Enable Deployment'
        default: true
        required: true
        type: boolean
      log_level:
        description: 'Log level'
        required: true
        default: 'info'
        type: choice
        options:
          - info
          - debug

jobs:
  run:
    name: Run Node NPM CI Workflow
    secrets: inherit
    uses: ATT-IDP/revup-workflows/.github/workflows/reusable_workflow_node_npm_ci.yaml@v3
    with:
      enable_sonar: ${{ github.event.inputs.enable_sonar }}
      enable_veracode_sast: ${{ github.event.inputs.enable_veracode_sast }}
      enable_veracode_sca: ${{ github.event.inputs.enable_veracode_sca }}
      enable_deployment: ${{ github.event.inputs.enable_deployment }}
      log_level: ${{ github.event.inputs.log_level }}
      runner_group: 'concordia-linux-cpu2-ram7gi'

      ## Cypress and Playwright tests are disabled by default for this repo.
      ## To permanently enable one of the following tests, set its value to true.
      enable_cypress_tests: ${{ github.event.inputs.enable_cypress_tests }}
      enable_playwright_tests: ${{ github.event.inputs.enable_playwright_tests }}

      ## Cypress Container cypress/included:
      ## https://hub.docker.com/r/cypress/included/tags
      cypress_docker_tag: ''
